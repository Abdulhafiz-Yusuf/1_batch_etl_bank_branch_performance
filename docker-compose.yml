services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: halimat
      POSTGRES_PASSWORD: halimat123
      POSTGRES_DB: odoo_db
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    container_name: adminer_ui
    ports:
      - "8083:8080"
    depends_on:
      - postgres
volumes:
  postgres-db-volume: