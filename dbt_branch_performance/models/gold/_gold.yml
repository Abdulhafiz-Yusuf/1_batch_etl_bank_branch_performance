version: 2
models:
# =============== Fact and Dimension Models ===============
# =============== fct_branch_daily_performance ===============
  - name: fct_branch_daily_performance
    description: >
      Gold fact table representing daily branch-level financial and
      operational performance.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - branch_id
            - performance_date

    columns:
      - name: branch_id
        tests:
          - not_null

      - name: performance_date
        tests:
          - not_null

      - name: liquidity_gap
        tests:
          - dbt_utils.expression_is_true:
              expression: "liquidity_gap IS NOT NULL"
    
# =============== dim_branch ===============  
  - name: dim_branch
    description: "Branch dimension table containing unique bank branches"
    columns:
      - name: branch_id
        description: "Unique branch identifier"
        meta:
          is_primary_key: true
        tests:
          - not_null
          - unique

      - name: branch_name
        description: "Branch descriptive name"
        tests:
          - not_null

# =============== dim_date ===============
  - name: dim_date
    description: "Date dimension table for analytics and time-based reporting"
    columns:
      - name: date_id
        description: "Primary key for date dimension"
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null

      - name: year
        tests:
          - not_null

      - name: month
        tests:
          - not_null

      - name: day
        tests:
          - not_null

      - name: is_weekend
        tests:
          - not_null
