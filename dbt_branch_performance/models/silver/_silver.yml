version: 2

sources:
  - name: bronze
    database: de_db
    schema: bronze
    tables:
      - name: bank_branch_performance
        description: "Raw branch-level performance data from ETL pipeline"

models:
# =============== Intermediate Models ===============
# =============== int_clean_branch_performance ===============

  - name: int_clean_branch_performance
    description: >
      Silver-layer cleaned and sanity-checked branch performance data.
      Source of truth for Gold marts.

    columns:
      - name: branch_id
        tests:
          - not_null

      - name: performance_date
        tests:
          - not_null

      - name: total_deposits
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "total_deposits >= 0"

      - name: total_loans
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "total_loans >= 0"

      - name: new_accounts
        tests:
          - dbt_utils.expression_is_true:
              expression: "new_accounts >= 0"

      - name: closed_accounts
        tests:
          - dbt_utils.expression_is_true:
              expression: "closed_accounts >= 0"


# =============== int_branch_monthly ===============
  - name: int_branch_monthly
    description: "Aggregated monthly metrics per branch"
    columns:
      - name: branch_id
        tests:
          - not_null
          - unique

      - name: branch_name
        tests:
          - not_null

      - name: month
        tests:
          - not_null

      - name: total_deposits
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "total_deposits >= 0"

      - name: total_loans
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "total_loans >= 0"

      - name: new_accounts
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "new_accounts >= 0"

      - name: closed_accounts
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "closed_accounts >= 0"

      - name: net_profit
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "net_profit >= 0"

      - name: operating_expenses
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "operating_expenses >= 0"
